<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dan Bartyzal | Personal Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-obsidian: #0a0a0c;
      --bg-card: #121216;
      --bg-card-hover: #18181e;
      --brass-primary: #c5a059;
      --brass-light: #dfc286;
      --brass-dim: rgba(197, 160, 89, 0.25);
      --brass-glow: rgba(197, 160, 89, 0.08);
      --text-main: #f3f1ed;
      --text-muted: #9a9893;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --radius-lg: 14px;
      --radius-md: 10px;
      --transition: all 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-obsidian);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.09) 0%, transparent 55%),
        linear-gradient(180deg, #0a0a0c 0%, #0d0d10 100%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 36px 18px 64px;
      line-height: 1.5;
    }

    .hub-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Editorial Header & Bio */
    .profile-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .avatar-frame {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--brass-light), #6e5525, var(--brass-primary));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), 0 0 20px var(--brass-glow);
      position: relative;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--brass-primary);
      letter-spacing: 0.04em;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-main);
      line-height: 1.15;
    }

    .profile-subtitle {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--brass-primary);
      font-weight: 500;
      margin-top: -4px;
    }

    .profile-bio {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 300;
      max-width: 380px;
      line-height: 1.6;
    }

    /* Direct Payment Icon Row */
    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--brass-primary);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .section-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--brass-dim), transparent);
    }

    .payment-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .pay-pill {
      background: var(--bg-card);
      border: 1px solid var(--brass-dim);
      border-radius: var(--radius-md);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-main);
      transition: var(--transition);
      cursor: pointer;
    }

    .pay-pill:hover {
      background: var(--bg-card-hover);
      border-color: var(--brass-primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .pay-pill svg {
      width: 20px;
      height: 20px;
      color: var(--brass-primary);
    }

    .pay-title {
      font-size: 0.78rem;
      font-weight: 500;
    }

    .pay-handle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      color: var(--text-muted);
    }

    /* Link Cards */
    .links-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      transition: var(--transition);
      cursor: pointer;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .link-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--brass-dim);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
